# CI: builds, signs, and uploads Bloom to TestFlight.
#
# Three ways in:
#   - push a v* tag       a real release
#   - Actions > Run workflow   a build now, no tag needed
#   - the 1st of the month     the keep-alive
#
# The keep-alive exists because a TestFlight build STOPS BEING INSTALLABLE 90
# days after upload. Nothing warns you; the app simply disappears from her
# TestFlight one day. Monthly is well inside that, and re-uploading the same
# code is enough - the build number (github.run_number) always increases, which
# is all App Store Connect requires.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # 07:00 UTC on the 1st. Off the hour would be kinder to GitHub's scheduler
    # queue, but a few minutes' drift is irrelevant against a 90-day clock.
    - cron: "0 7 1 * *"
permissions:
  contents: write   # the keep-alive stamps a commit; see the last step
jobs:
  swift-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@v6
      - name: Run BloomCore tests
        run: swift test --package-path Packages/BloomCore
  build-and-upload:
    needs: swift-test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Select newest Xcode (iOS 26 SDK required to upload)
        run: |
          set -e
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc|release[_ ]candidate' | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "No Xcode found under /Applications"; exit 1; fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "iOS SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch fonts
        run: bash scripts/fetch_fonts.sh
      - name: Write App Store Connect API key
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc.p8"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive \
            -project Bloom.xcodeproj \
            -scheme Bloom \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Bloom.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Inspect archive (icon/plist diagnostic)
        run: |
          set +e
          APP="$RUNNER_TEMP/Bloom.xcarchive/Products/Applications/Bloom.app"
          echo "=== .app listing ==="; ls -la "$APP"
          echo "=== Assets.car present? ==="; ls -la "$APP/Assets.car" 2>/dev/null || echo "NO Assets.car"
          echo "=== CFBundleIconName ==="; /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist" 2>/dev/null || echo "MISSING CFBundleIconName"
          echo "=== CFBundleDisplayName ==="; /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" 2>/dev/null || echo "MISSING CFBundleDisplayName"
          echo "=== UIAppFonts ==="; /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$APP/Info.plist" 2>/dev/null || echo "MISSING UIAppFonts"
          echo "=== AppIcon entries in Assets.car ==="; xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -iE "AppIcon|Idiom|PixelWidth|PixelHeight" | head -60
          echo "=== full Info.plist ==="; plutil -p "$APP/Info.plist"
          exit 0
      - name: Verify bundled sounds and fonts
        run: |
          set -e
          APP="$RUNNER_TEMP/Bloom.xcarchive/Products/Applications/Bloom.app"
          missing=0
          for f in tap1.mp3 tap2.mp3 tap3.mp3 tap4.mp3 tap5.mp3 operator.mp3 equals.mp3 clear.mp3 error.mp3 success.mp3 modeswitch.mp3 easteregg.mp3 startup.mp3 Quicksand.ttf PlayfairDisplay.ttf PlayfairDisplay-Italic.ttf GreatVibes-Regular.ttf; do
            hit=$(find "$APP" -type f -name "$f")
            if [ -z "$hit" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "FOUND: $hit"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required bundled sounds/fonts are missing from the archived app."
            exit 1
          fi
          echo "All 13 sounds and 4 fonts verified present in the archive."
      - name: Export ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bloom.xcarchive" \
            -exportOptionsPlist App/Support/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Install fastlane
        run: bundle install
      - name: Upload to TestFlight
        env:
          IPA_PATH: ${{ runner.temp }}/export/Bloom.ipa
          ASC_KEY_FILEPATH: ${{ runner.temp }}/asc.p8
        run: bundle exec fastlane upload_testflight
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
      # GitHub disables a scheduled workflow after 60 days with no repository
      # activity - which would silently kill this keep-alive about a month
      # before the build it is meant to renew expires. A commit per run keeps
      # the clock reset and doubles as a plain-text record of the last upload.
      # [skip ci] so it does not also burn a build-check run.
      - name: Stamp the keep-alive
        continue-on-error: true
        if: github.event_name == 'schedule'
        run: |
          set -e
          mkdir -p .github
          echo "last keep-alive upload: $(date -u +'%Y-%m-%d %H:%M UTC')  (build ${{ github.run_number }})" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: TestFlight keep-alive, build ${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
