# CI: runs BloomCore's Swift Package tests on every push and pull request.
name: test
on:
  push:
    branches: ["**"]
  pull_request: {}
jobs:
  swift-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@v6
      - name: Run BloomCore tests
        # Workspace-relative: in a container job runner.temp names the HOST path.
        run: |
          export BLOOM_XLSX_SAMPLE_DIR="$PWD/xlsx-sample"
          mkdir -p "$BLOOM_XLSX_SAMPLE_DIR"
          swift test --package-path Packages/BloomCore
      # A real exported month, to open in Excel/Numbers and judge by eye.
      - name: Upload sample budget spreadsheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-xlsx-sample
          path: xlsx-sample
          if-no-files-found: ignore
